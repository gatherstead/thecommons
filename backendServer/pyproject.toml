[project]
name = "backendserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.11.0",
    "django==6.0.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "pillow>=12.1.0",
    "psycopg>=3.3.2 ; sys_platform != 'darwin'",
    "psycopg[binary]>=3.3.2",
    "psycopg[binary]>=3.3.2 ; sys_platform == 'darwin'",
    "python-dotenv==1.2.1",
    "sqlparse==0.5.5",
    "icalendar>=6.1.0",
    "requests>=2.32.0",
    "thefuzz>=0.22.0",
    "google-genai>=1.66.0",
    "django-unfold>=0.83.1",
    "beautifulsoup4>=4.14.3",
    "lxml>=5.3.0",
    "pyjwt[crypto]>=2.10.0",
    # 1.x exposes the `brevo_python` module (TransactionalEmailsApi/SendSmtpEmail API
    # used in email_service.py). 4.x is a Fern rewrite that imports as `brevo` with a
    # different API — do not bump without porting email_service.py.
    "brevo-python>=1.2.0,<2",
    "gunicorn>=26.0.0",
    "playwright>=1.60.0",
    "django-ratelimit>=4.1.0",
    "celery[redis]>=5.6.3",
    "django-celery-beat>=2.9.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "djangorestframework-stubs>=3.17.0",
    "mypy>=2.2.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*", "vercel.json", "build.sh", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# LLM prompt strings contain lines that cannot be wrapped without changing the prompt
"ingestion/standardizer.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "events", "ingestion", "broadcast"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "backend.settings.dev"
