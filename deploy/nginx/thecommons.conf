# The Commons — nginx config. ONE file, many server blocks (repo
# convention — see the old DEPLOY.md §nginx / deploy/nginx-broadcast.conf.snippet,
# which this supersedes now that nginx runs containerized).
#
# Baked into the image at /etc/nginx/conf.d/thecommons.conf by
# deploy/nginx/Dockerfile. This is the PRODUCTION config — it requires the
# Cloudflare origin cert to be bind-mounted at container start (see
# docker-compose.yml's nginx volumes). It only actually runs when compose is
# invoked as `-f docker-compose.yml` alone (the VM). Plain `docker compose
# up` (local dev) auto-loads docker-compose.override.yml, which replaces
# this file's content at the same container path with an HTTP-only
# equivalent via an inline `configs:` block, since a dev machine has neither
# the cert nor real DNS for the *.thecommons.town hostnames below.
#
# TLS: Cloudflare Full-strict. Cert/key bind-mounted read-only — never
# baked into this or any other image layer.

# Docker's embedded DNS server. Required because every proxy_pass below
# resolves its upstream through a *variable* rather than a literal hostname.
#
# Why bother: with a literal `proxy_pass http://nextjs:3000`, nginx resolves
# the name once at startup and REFUSES TO BOOT if it doesn't resolve
# ("[emerg] host not found in upstream"). Since this service is
# `restart: unless-stopped`, a nextjs container that is down or still
# starting when nginx restarts would take nginx down with it — and with it
# api.thecommons.town and broadcast.thecommons.town, which have nothing to
# do with nextjs. One crashed frontend becomes a total ingress outage.
#
# Resolving through a variable defers the lookup to request time, so nginx
# always boots and a dead upstream degrades to a 502 on just that one
# hostname. `valid=10s` re-resolves regularly, which also means a recreated
# container's new IP is picked up without an nginx reload. ipv6=off because
# the compose network is v4-only and the AAAA lookup just adds latency.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Real client IP ─────────────────────────────────────────────────────────
# Every hostname here is proxied through Cloudflare, so $remote_addr is a
# Cloudflare edge IP, not the visitor. Django's rate limiting keys on
# X-Real-IP (RATELIMIT_IP_META_KEY in backend/settings/prod.py), so passing
# $remote_addr put EVERY user of the app into one shared bucket per edge IP —
# broadcast's per-endpoint limits (5-30/min) then tripped on other people's
# traffic and surfaced as sporadic, unreproducible 403s.
#
# CF-Connecting-IP is set by Cloudflare on every proxied request and cannot be
# spoofed through it (Cloudflare overwrites any client-supplied value). The
# $remote_addr fallback keeps a direct-to-origin request (health probes,
# curl -k against the origin cert) from sending an empty X-Real-IP, which
# django-ratelimit treats as a misconfiguration and turns into a 500.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# ── HTTP -> HTTPS redirect, all hostnames ──────────────────────────────────
server {
    listen 80;
    server_name thecommons.town www.thecommons.town api.thecommons.town broadcast.thecommons.town auth.thecommons.town;
    return 301 https://$host$request_uri;
}

# ── www -> apex redirect ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.thecommons.town;

    ssl_certificate     /etc/ssl/cloudflare/thecommons.town.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thecommons.town.key;

    return 301 https://thecommons.town$request_uri;
}

# ── thecommons.town -> Next.js ──────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name thecommons.town;

    ssl_certificate     /etc/ssl/cloudflare/thecommons.town.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thecommons.town.key;

    location / {
        # Variable upstream — see the `resolver` note at the top of this file.
        # No URI part after the port, so the original request URI is passed
        # through unchanged.
        set $upstream_nextjs nextjs;
        proxy_pass http://$upstream_nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── auth.thecommons.town -> Next.js (Better Auth portal) ────────────────────
# Same upstream as the apex (one Next.js app serves both hostnames); the
# split exists so Better Auth owns a dedicated origin, which is what makes
# the `.thecommons.town` cookie domain work across subdomains (suite 37 —
# docs/runbook-auth-cutover.md).
#
# This block is NOT optional and must never be dropped: `backendServer/.env`
# points BETTER_AUTH_JWKS_URL/BETTER_AUTH_ISSUER at this hostname, so every
# broadcast JWT verification fetches https://auth.thecommons.town/api/auth/jwks
# through it. Without this server block, requests to auth.thecommons.town fall
# through to the first `listen 443 ssl` block (the www -> apex redirect), which
# 301s the JWKS fetch and 403s every tier-2 broadcast request — the same
# symptom as the 2026-07-20 JWKS outage, from a different cause.
server {
    listen 443 ssl;
    server_name auth.thecommons.town;

    ssl_certificate     /etc/ssl/cloudflare/thecommons.town.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thecommons.town.key;

    location / {
        # Variable upstream — see the `resolver` note at the top of this file.
        set $upstream_nextjs_auth nextjs;
        proxy_pass http://$upstream_nextjs_auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── api.thecommons.town -> Django (gunicorn) ────────────────────────────────
server {
    listen 443 ssl;
    server_name api.thecommons.town;

    ssl_certificate     /etc/ssl/cloudflare/thecommons.town.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thecommons.town.key;

    # Event image uploads (T7) pass through this proxy to gunicorn.
    client_max_body_size 20m;

    # Baked collectstatic output — never proxied to gunicorn; Django's
    # staticfiles app isn't even asked.
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # Client-uploaded event images (MEDIA_ROOT) — bind-mounted real host
    # data, served by nginx directly. NEVER proxied to gunicorn in prod.
    # Kept indefinitely; no pruning job (see docker-compose.yml volumes).
    location /media/ {
        alias /var/www/media/;
    }

    location / {
        # Variable upstream — see the `resolver` note at the top of this file.
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── broadcast.thecommons.town -> static SPA ─────────────────────────────────
server {
    listen 443 ssl;
    server_name broadcast.thecommons.town;

    ssl_certificate     /etc/ssl/cloudflare/thecommons.town.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thecommons.town.key;

    # Baked SPA build — not a bind mount (a volume here would let a stale
    # build survive a deploy). No Node process behind this.
    root /usr/share/nginx/html/broadcast;
    index index.html;

    location / {
        # Client-side routing: unknown paths fall back to index.html.
        try_files $uri /index.html;
    }
}
